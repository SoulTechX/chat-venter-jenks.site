<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4a926a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VJ Portal">
  <title>Venter Jenks - Login</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0;
      background-color: #121212; /* Fallback */
      background-color: var(--bg-primary, #121212); 
      color: var(--text-primary, #ffffff); 
      font-family: 'Inter', sans-serif;
    }
    .login-container { 
      background: var(--bg-secondary, #1e1e1e); 
      padding: 2.5rem 2rem; 
      border-radius: 12px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      width: 100%; 
      max-width: 360px; 
    }
    .login-container h2 { 
      margin-top: 0; 
      margin-bottom: 1.5rem; 
      text-align: center; 
      font-weight: 600;
    }
    .form-group { 
      margin-bottom: 1.25rem; 
    }
    .form-group label { 
      display: block; 
      margin-bottom: 0.5rem; 
      font-size: 0.9rem;
      color: var(--text-secondary, #a0a0a0);
    }
    .form-group input { 
      width: 100%; 
      padding: 0.85rem; 
      border: 1px solid var(--border-color, #333); 
      border-radius: 6px; 
      background: var(--bg-primary, #121212); 
      color: var(--text-primary, #ffffff); 
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--primary-color, #4A90D9);
    }
    .btn-login { 
      width: 100%; 
      padding: 0.85rem; 
      background: var(--primary-color, #4A90D9); 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 1rem; 
      margin-top: 0.5rem; 
      transition: filter 0.2s;
    }
    .btn-login:hover { 
      filter: brightness(1.1); 
    }
    .error-msg { 
      color: #e74c3c; 
      margin-top: 1rem; 
      text-align: center; 
      display: none; 
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="logo.png" alt="Venter Jenks" style="max-width: 200px; height: auto;">
    </div>
    <h2>Iniciar Sesión</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Contraseña (cualquiera es válida)</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Ingresar al Portal</button>
      <div id="error-msg" class="error-msg"></div>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          sessionStorage.setItem('vj_token', data.token);
          sessionStorage.setItem('vj_user', JSON.stringify(data.user));
          window.location.href = 'app.html';
        } else {
          errorMsg.textContent = data.error || 'Error al iniciar sesión';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Error de red. Verifica la conexión.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
